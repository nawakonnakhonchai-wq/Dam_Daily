name: Update Dam GeoJSON Daily

on:
  schedule:
    - cron: '15 11,23 * * *' # รันเวลา 06:15 และ 18:15 ตามเวลาประเทศไทย (ICT)
  workflow_dispatch: # อนุญาตให้กดรันเองด้วยมือได้จากหน้าเว็บ GitHub

jobs:
  update-map-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run script to generate GeoJSON
        run: |
          python main.py

      - name: Commit and push if it changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add rid_dams_updated.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dam GeoJSON data" && git push)
